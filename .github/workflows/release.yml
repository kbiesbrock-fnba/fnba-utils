name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs and vite.config.ts both call `git rev-list --count HEAD`
          # to compute the +<count> version suffix; a shallow clone breaks it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install app deps
        working-directory: app
        run: npm ci

      - name: Build portable zip
        working-directory: app
        run: npm run package

      # Bind the tag name to an env var (never inline `${{ ... }}` in `run:`
      # commands -- a malicious tag name could be parsed as shell syntax).
      # Build the release body from RELEASE_NOTES.md: every `## ` section above
      # the previous tag's heading — i.e. everything added since the last
      # release — so the GitHub Release shows only what's new instead of the
      # whole cumulative changelog. The in-repo file stays cumulative; we only
      # slice it here. Assumes each released version has a `## <tag>` heading
      # (e.g. `## v1.12.6`); the previous tag's heading is the stop marker.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # Previous tag by commit ancestry; empty on the first release.
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            # Print from the first version heading down to (but not including)
            # the previous release's heading. Skips the `# Release Notes` title,
            # any preamble, and the `## [Unreleased]` staging section.
            awk -v prev="$prev" '
              /^## / {
                if ($2 == "[Unreleased]") next
                started = 1
                if ($2 == prev) exit
              }
              started { print }
            ' app/RELEASE_NOTES.md > release-body.md
          else
            cp app/RELEASE_NOTES.md release-body.md
          fi
          # Fall back to the full file if the slice came out empty (e.g. the
          # previous tag has no matching heading), so a release never ships
          # with blank notes.
          if [ ! -s release-body.md ]; then
            cp app/RELEASE_NOTES.md release-body.md
          fi
          echo "----- release body for $TAG -----"
          cat release-body.md
          gh release create "$TAG" releases/*.zip \
            --title "$TAG" \
            --notes-file release-body.md
