[package]
name = "fnba-utils"
version = "1.12.4"
description = "FNBA Utils command palette"
authors = ["kbiesbrock"]
edition = "2021"
default-run = "fnba-utils"

[lib]
name = "fnba_utils_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "6"
ctrlc = "3"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "winauth", "chrono"] }
tokio = { version = "1", features = ["net", "time", "rt", "process", "io-util", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
chrono = "0.4"
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
arboard = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
fuzzy-matcher = "0.3"
winreg = "0.52"
regex = "1"
once_cell = "1"
rand = "0.8"

[[bin]]
name = "fnba-clipd"
path = "src/bin/clipd.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }
