[package]
name = "fnba-utils"
version = "0.1.0"
description = "FNBA Utils command palette"
authors = ["kbiesbrock"]
edition = "2021"

[lib]
name = "fnba_utils_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ctrlc = "3"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "winauth", "chrono"] }
tokio = { version = "1", features = ["net", "time", "rt"] }
tokio-util = { version = "0.7", features = ["compat"] }
chrono = "0.4"
